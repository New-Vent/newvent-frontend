name: ci

# PR 과 main 푸시에서 "빌드가 되는가" 만 본다. 배포는 하지 않는다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      #   build 보다 먼저 와야 한다.
      #   vite.config.js 의 eventCss 플러그인이 buildStart 에서 event.css 를
      #   다시 만든다. build 뒤에 검사하면 방금 만든 것과 비교하게 되어
      #   원본과 산출물이 어긋나 있어도 늘 통과한다.
      - name: event.css 가 원본과 맞는가
        run: npm run css:check

      # MISSING_EXPORT · 해결 안 되는 import 를 여기서 잡는다.
      # 오늘까지 겪은 ReferenceError 상당수가 이 단계에서 걸린다.
      - name: 두 벌 빌드
        run: npm run build

      - name: 산출물 확인
        run: |
          set -e
          test -f dist/user/index.html
          test -f dist/admin/index.html
          test -f dist/user/assets/event.css
          # 관리자 번들이 /admin/static/ 을 가리켜야 한다 (vite base 확인)
          grep -q '/admin/static/' dist/admin/index.html
          # 사용자 번들은 /static/ 이어야 한다
          grep -q '"/static/' dist/user/index.html
          echo "산출물 경로 정상"
