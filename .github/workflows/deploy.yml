# .github/workflows/deploy.yml
#
# main 에 푸시되면 빌드해서 EC2 의 /srv/web 에 배포한다.
#
#   Actions ──빌드──▶ S3 releases/{sha}/ ──SSM 지시──▶ EC2 가 직접 받아서 설치
#
# ★ 자격증명을 저장하지 않는다 — OIDC 로 NewVentDeploy 역할을 잠깐 빌린다.
# ★ 파일은 S3 로, 지시만 SSM 으로. (22번 포트가 닫혀 있어 scp 가 안 된다)
# ★ 실제 설치는 deploy/remote-install.sh 가 한다 — YAML 안에 쉘을 넣지 않는다.

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # Actions 탭에서 "다시 배포"

permissions:
  id-token: write             # ★ OIDC 에 필수. 없으면 역할을 못 빌린다
  contents: read

# ★ cancel-in-progress 를 켜지 않는다.
#   교체 도중에 취소되면 /srv/web 이 반쪽 상태로 남는다.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  BUCKET: newvent-deploy
  INSTANCE: i-04fc2a92b84384a2a

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # event.css 는 src/event-css/ 를 합쳐 만든 산출물이다.
      # 원본과 어긋난 채로 배포되면 화면만 보고는 원인을 못 찾는다.
      - name: event.css 가 원본과 같은지
        run: npm run css:check

      - run: npm run build

      # 빈 dist 를 배포해 사이트를 날리는 것을 막는다.
      - name: 산출물 확인
        run: |
          for f in dist/user/index.html dist/admin/index.html dist/user/assets/event.css; do
            test -s "$f" || { echo "::error::$f 가 없거나 비어 있습니다"; exit 1; }
          done
          du -sh dist/user dist/admin

      # ★ 러너가 리눅스라 macOS 의 리소스 포크(._*) 문제가 없다.
      #   publish-via-ssm.sh 가 COPYFILE_DISABLE 로 막던 그 문제다.
      - name: 묶기
        run: |
          tar -czf user.tgz  -C dist/user  .
          tar -czf admin.tgz -C dist/admin .
          ls -l user.tgz admin.tgz

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # releases/{sha}/ 로 올린다 — 되돌릴 때 이전 sha 를 다시 설치하면 된다.
      # 수명주기 규칙이 30일 뒤 지운다.
      - name: S3 업로드
        run: |
          P="s3://$BUCKET/releases/${{ github.sha }}"
          aws s3 cp user.tgz                 "$P/user.tgz"
          aws s3 cp admin.tgz                "$P/admin.tgz"
          aws s3 cp deploy/remote-install.sh "$P/install.sh"

      - name: EC2 에서 설치
        run: |
          # ★ 파라미터 JSON 을 파이썬으로 만든다. 쉘 따옴표로 JSON 을 조립하면 반드시 깨진다.
          python3 - > params.json <<'PY'
          import json, os, sys
          sha = os.environ["GITHUB_SHA"]
          cmd = "\n".join([
              "set -e",
              f"aws s3 cp s3://newvent-deploy/releases/{sha}/install.sh /tmp/nv-install.sh --region ap-northeast-2",
              f"SHA={sha} bash /tmp/nv-install.sh",
              "rm -f /tmp/nv-install.sh",
          ])
          json.dump({"commands": [cmd]}, sys.stdout)
          PY

          ID=$(aws ssm send-command \
                 --instance-ids "$INSTANCE" \
                 --document-name AWS-RunShellScript \
                 --comment "frontend ${{ github.sha }}" \
                 --parameters file://params.json \
                 --query Command.CommandId --output text)
          echo "CommandId=$ID"

          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "─── 서버 출력 ───"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text || true

          if [ "$status" != Success ]; then
            echo "::error::설치 실패 ($status)"
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
              --query StandardErrorContent --output text || true
            exit 1
          fi

      # 실제로 뜨는지 밖에서 확인한다. 여기서 깨지면 배포가 실패로 남아야 한다.
      - name: 배포 확인
        run: |
          fail=0
          for p in / /admin/ /assets/event.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://newvent.duckdns.org$p")
            echo "$p → $code"
            [ "$code" = 200 ] || fail=1
          done
          exit $fail
