# 공통 보안 헤더
#
# nginx 의 add_header 는 상속이 "덮어쓰기" 다 — 하위 블록에 add_header 가
# 하나라도 있으면 상위 블록의 add_header 는 전부 사라진다.
# 그래서 자체 add_header 를 쓰는 location 마다 이 파일을 다시 include 한다.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

# 편집 스튜디오가 미리보기를 same-origin iframe 으로 띄운다.
# DENY 로 하면 미리보기가 통째로 막히므로 SAMEORIGIN 이어야 한다.
add_header X-Frame-Options "SAMEORIGIN" always;

# HSTS 는 인증서가 확실히 자리잡고 갱신까지 확인한 뒤에 켠다.
# 한 번 켜면 브라우저가 max-age 동안 HTTP 접속을 거부하므로,
# 인증서에 문제가 생겼을 때 되돌리기가 어렵다.
# add_header Strict-Transport-Security "max-age=31536000" always;
