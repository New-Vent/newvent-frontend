# 1단계 — 인증서 발급 전에만 쓰는 임시 설정
#
# newvent.conf 는 ssl_certificate 를 참조한다. 인증서가 아직 없는 상태로
# 그 파일을 올리면 nginx 가 기동에 실패하고, nginx 가 안 떠 있으면
# certbot 의 HTTP-01 검증도 실패한다 (닭과 달걀).
#
# 그래서 먼저 이 파일로 80 포트만 띄워 인증서를 받고,
# 그 다음 newvent.conf 로 교체한다. 자세한 순서는 deploy/SETUP.md 참고.

server {
    listen      80;
    listen      [::]:80;
    server_name newvent.duckdns.org;

    # certbot HTTP-01 검증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "newvent bootstrap ok\n";
        add_header Content-Type text/plain;
    }
}
