# NewVent — nginx 설정 (EC2 단일 호스트)
# 배치 위치: /etc/nginx/conf.d/newvent.conf
#
# 경로 설계 (NewVent_인프라.md 2장)
#   /              사용자 화면      정적 (Vite 빌드 산출물)
#   /admin/        관리자 화면      정적 (Vite 빌드 산출물, 별도 번들)
#   /api/          API              Spring :8080
#   /e/{slug}      게시된 이벤트    Spring :8080 (DB 의 html_content)
#   /assets/       event.css · event.js
#
# 디스크 레이아웃
#   /srv/web/index.html          사용자 SPA 진입점
#   /srv/web/static/…            사용자 번들 (해시 파일명)
#   /srv/web/admin/index.html    관리자 SPA 진입점
#   /srv/web/admin/static/…      관리자 번들 (해시 파일명)
#   /srv/web/assets/…            event.css · event.js
#
# ★ Vite 의 build.assetsDir 를 'static' 으로 바꿔야 한다.
#   기본값이 'assets' 인데, 인프라 문서가 /assets/** 를 event.css · event.js
#   자리로 이미 예약해놨다. 그대로 두면 배포할 때마다 서로 덮어쓴다.

server {
    listen      80;
    listen      [::]:80;
    server_name newvent.duckdns.org;

    # 갱신 검증은 HTTP 로 들어온다 — 리다이렉트보다 먼저 와야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # ★ Ubuntu 24.04 의 nginx 는 1.24.0 이라 `http2 on;` 을 모른다.
    #   (그 지시어는 1.25.1 부터다. 쓰면 nginx -t 가 실패한다.)
    #   아래 형식은 1.24 에서 동작하고, 1.25.1+ 에서도 deprecated 경고만 뜨고 돈다.
    #   서버를 1.25.1 이상으로 올리면 `listen 443 ssl;` + `http2 on;` 으로 바꾸는 편이 낫다.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name newvent.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/newvent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newvent.duckdns.org/privkey.pem;
    #   certbot 2.9 를 `certonly --webroot` 로 쓰면
    #   /etc/letsencrypt/options-ssl-nginx.conf 와 ssl-dhparams.pem 을 만들지 않는다.
    #   (그 파일들은 --nginx 플러그인이 설정을 자동으로 고칠 때 깔아둔다.)
    #   그래서 SSL 옵션을 여기 직접 적는다. 내용은 그 파일이 담던 것과 같다.
    ssl_session_cache   shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";

    root /srv/web;

    include /etc/nginx/snippets/newvent-security-headers.conf;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/css text/javascript application/javascript application/json
                    image/svg+xml font/woff2;

    # 이벤트 이미지 업로드가 생기면 늘린다.
    client_max_body_size 10m;

    # ── API ─────────────────────────────────────────────────────────
    # 생성 진행 상태를 SSE 로 흘리므로 버퍼링을 끈다.
    # 켜져 있으면 nginx 가 이벤트를 모아뒀다 한 번에 내보내서
    # 진행 표시가 통째로 무의미해진다. (JSON 응답에도 걸리지만
    # 이 규모에서 체감 차이는 없다.)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ★ 없으면 Spring 이 요청을 HTTP 로 보고 Secure 쿠키를 안 내린다.
        #   application.yml 에 server.forward-headers-strategy: framework 도 함께.
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 는 keep-alive 연결을 유지해야 한다.
        proxy_set_header Connection        "";

        proxy_buffering          off;
        proxy_cache              off;
        chunked_transfer_encoding off;

        # LLM 생성이 재시도까지 가면 기본 60초를 넘긴다.
        # 넘기면 nginx 가 504 를 내는데 백엔드는 멀쩡히 돌고 있어서
        # 원인을 찾기 어렵다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── 인증 ────────────────────────────────────────────────────────
    # ★ 백엔드 인증 경로에 /api 가 없다. /auth/admin/login · /auth/refresh 다.
    #   (docs/백엔드-실측-현황.md A-2) 이 블록이 없으면 로그인이 안 된다.
    #   Refresh 쿠키가 Path=/auth 라 경로를 그대로 살려야 쿠키가 실린다.
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 없으면 Spring 이 요청을 HTTP 로 보고 Secure 쿠키를 안 내린다.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ── 게시된 이벤트 페이지 ────────────────────────────────────────
    # 서버가 렌더한 완성 HTML 이므로 버퍼링은 켜둔 채로 둔다.
    location /e/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ── 해시 파일명 번들 — 영구 캐시 ────────────────────────────────
    location ^~ /static/ {
        include /etc/nginx/snippets/newvent-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /admin/static/ {
        include /etc/nginx/snippets/newvent-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── event.css · event.js ────────────────────────────────────────
    # 파일명에 해시가 없으므로 짧게 잡는다.
    # try_files =404 가 중요하다 — 없으면 아래 SPA fallback 이 걸려서
    # 빠진 CSS 요청에 index.html 이 200 으로 돌아온다.
    location ^~ /assets/ {
        include /etc/nginx/snippets/newvent-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ── 관리자 화면 ─────────────────────────────────────────────────
    # 인프라 문서는 alias 를 썼는데, alias + try_files 는 트레일링
    # 슬래시 처리가 까다롭다. 디스크 경로를 URL 과 같은 모양
    # (/srv/web/admin) 으로 두면 root 만으로 해결된다.
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/newvent-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;

        # 발표 환경을 확인한 뒤 필요하면 주석을 푼다.
        # 인프라 문서 2장 "관리자 화면 접근 제한 (선택)".
        # allow 203.0.113.0/24;
        # deny  all;
    }

    # ── 사용자 화면 ─────────────────────────────────────────────────
    # index.html 에 no-cache 를 주지 않으면, 배포해도 브라우저가
    # 예전 index.html 을 들고 있어서 사라진 해시 번들을 찾는다.
    location / {
        include /etc/nginx/snippets/newvent-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
